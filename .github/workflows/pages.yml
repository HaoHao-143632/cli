name: Deploy English Practice site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/amazing-thompson-ylo7cb
    paths:
      - "web/english-practice/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布英语练习网站这个子目录，站点根即该目录
          path: web/english-practice

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
