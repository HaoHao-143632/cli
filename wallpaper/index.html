<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#050308" />
<meta name="format-detection" content="telephone=no" />
<title>国风动态壁纸 · 月下独立</title>
<style>
  :root {
    --ink: #0a0612;
    --plum: #2a1230;
    --rose: #e07b5a;
    --silk: #f6c2a0;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    background: #050308;
    font-family: "STKaiti", "KaiTi", "Songti SC", "SimSun", serif;
    color: #e9d6c2;
  }
  /* 用 dvh 应对手机浏览器地址栏伸缩造成的高度跳动 */
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }

  .stage {
    position: fixed;
    inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    background:
      radial-gradient(ellipse at 70% 25%, rgba(224, 123, 90, 0.18) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 30%, #2a1830 0%, #120a1a 55%, #050308 100%);
  }

  /* 远星 */
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff8, transparent 50%),
      radial-gradient(1px 1px at 28% 9%, #fff6, transparent 50%),
      radial-gradient(1px 1px at 47% 22%, #fff5, transparent 50%),
      radial-gradient(1px 1px at 63% 14%, #fff7, transparent 50%),
      radial-gradient(1px 1px at 88% 30%, #fff5, transparent 50%),
      radial-gradient(1px 1px at 8% 40%, #fff4, transparent 50%),
      radial-gradient(1px 1px at 92% 50%, #fff4, transparent 50%);
    animation: twinkle 6s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.55; }
    to   { opacity: 1;    }
  }

  /* 圆月 */
  .moon {
    position: absolute;
    top: 9%;
    right: 12%;
    width: 22vmin;
    height: 22vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--silk), var(--rose) 55%, #7a2330 95%);
    box-shadow:
      0 0 6vmin rgba(224, 123, 90, 0.45),
      0 0 14vmin rgba(224, 123, 90, 0.18);
  }
  @media (orientation: landscape) {
    .moon { width: 16vmin; height: 16vmin; top: 8%; }
  }
  .moon::after {
    content: "";
    position: absolute;
    inset: 18% 28% 60% 22%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.18), transparent 70%);
    border-radius: 50%;
    filter: blur(2px);
  }

  /* 远山剪影 */
  .mountains {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 38%;
    pointer-events: none;
  }
  .mountains svg { width: 100%; height: 100%; display: block; }

  /* 中央人物舞台 */
  .figure-wrap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 92%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    pointer-events: none;
  }
  .figure-wrap svg {
    /* 手机竖屏下基于宽度，让人物撑得更挺拔 */
    width: min(95vw, 720px);
    height: auto;
    max-height: 88%;
    filter: drop-shadow(0 8px 30px rgba(0,0,0,0.55));
    animation: breathe 5s ease-in-out infinite;
    transform-origin: 50% 95%;
  }
  @media (orientation: landscape) {
    .figure-wrap svg { width: min(70vmin, 720px); }
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-4px) scale(1.005); }
  }

  /* 飘落花瓣 */
  .petal {
    position: absolute;
    top: -5vh;
    width: 14px;
    height: 10px;
    background: radial-gradient(ellipse at 30% 30%, #ffd6d8, #f49aa6 70%, #c45a6e);
    border-radius: 60% 40% 60% 40% / 70% 30% 70% 30%;
    opacity: 0.85;
    filter: drop-shadow(0 0 4px rgba(244, 154, 166, 0.45));
    animation: fall linear infinite, sway ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes fall {
    from { transform: translate3d(0, -10vh, 0) rotate(0deg); }
    to   { transform: translate3d(0, 110vh, 0) rotate(720deg); }
  }
  @keyframes sway {
    from { margin-left: -2vw; }
    to   { margin-left:  2vw; }
  }

  /* 题字 */
  .poem {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 4%);
    left: 6%;
    writing-mode: vertical-rl;
    font-size: clamp(13px, 3.6vmin, 22px);
    letter-spacing: 0.55em;
    color: rgba(233, 214, 194, 0.82);
    text-shadow: 0 0 12px rgba(224, 123, 90, 0.3);
    line-height: 1.8;
    user-select: none;
  }
  @media (orientation: landscape) {
    .poem { top: 14%; left: 7%; font-size: clamp(14px, 1.8vmin, 20px); letter-spacing: 0.6em; }
  }
  .poem .small {
    font-size: 0.7em;
    letter-spacing: 0.3em;
    opacity: 0.7;
  }

  .seal {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 5%);
    left: 7%;
    width: 38px; height: 38px;
    border: 2px solid #b03a3a;
    color: #b03a3a;
    background: rgba(176, 58, 58, 0.05);
    display: grid; place-items: center;
    font-size: 16px;
    border-radius: 4px;
    transform: rotate(-3deg);
    opacity: 0.85;
  }

  /* 全屏提示，仅手机首次进入显示，点击隐藏并尝试进入全屏 */
  .hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 6%);
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 18px;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: rgba(233, 214, 194, 0.7);
    background: rgba(20, 10, 28, 0.45);
    border: 1px solid rgba(224, 123, 90, 0.3);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    animation: hintPulse 2.4s ease-in-out infinite;
    z-index: 10;
  }
  .hint.hidden { opacity: 0; transition: opacity 0.6s; }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1;    }
  }

  /* 尊重用户系统设置：减少动效 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="stars"></div>
    <div class="moon"></div>

              M345 300 Q 290 530 310 730 Q 300 870 350 960 L 460 970 Q 500 860 490 710 Q 490 520 455 300 Z;

              M260 540 Q 120 590 70 700 Q 50 830 130 920 Q 150 860 200 810 Q 250 730 300 670 Q 320 610 290 560 Z;
              M260 540 Q 160 610 110 730 Q 80 810 130 880 Q 150 840 190 790 Q 240 720 290 660 Q 320 610 290 560 Z;
              M260 540 Q 140 600 90 720 Q 60 820 110 900 Q 140 850 180 800 Q 230 720 290 660 Q 320 610 290 560 Z"/>
        </path>

        <!-- ==================== 飘逸披帛（右袖）==================== -->
        <path fill="url(#sash)"
              d="M540 540 Q 660 600 720 700 Q 760 820 700 900 Q 660 850 620 800 Q 570 720 510 660 Q 480 610 510 560 Z"
              opacity="0.9">
          <animate attributeName="d" dur="6.4s" repeatCount="indefinite"
            values="
              M540 540 Q 660 600 720 700 Q 760 820 700 900 Q 660 850 620 800 Q 570 720 510 660 Q 480 610 510 560 Z;
              M540 540 Q 680 590 740 720 Q 770 830 690 920 Q 650 870 610 810 Q 560 730 510 670 Q 480 610 510 560 Z;
              M540 540 Q 640 610 700 730 Q 740 800 690 880 Q 660 840 620 790 Q 570 720 510 660 Q 480 610 510 560 Z;
              M540 540 Q 660 600 720 700 Q 760 820 700 900 Q 660 850 620 800 Q 570 720 510 660 Q 480 610 510 560 Z"/>

        <!-- ==================== 上身 / 衣领 ==================== -->
        <path fill="url(#dress)"
              d="M335 380

        <!-- 衣襟交领 -->
        <path fill="#1a0f24" opacity="0.9"
              d="M340 395 Q 400 430 460 395 L 455 425 Q 400 460 345 425 Z"/>
        <path fill="rgba(255,200,180,0.18)"
              d="M345 425 Q 400 460 455 425 L 450 445 Q 400 475 350 445 Z"/>

        <!-- ==================== 下裙（带飘动裙摆）==================== -->

              d="M320 540
                 L 270 880
                 Q 290 950 330 970

                 Q 510 950 530 880
                 L 480 540
                 Z">
          <animate attributeName="d" dur="7.2s" repeatCount="indefinite"
            values="
              M320 540 L 270 880 Q 290 950 330 970 L 470 970 Q 510 950 530 880 L 480 540 Z;
              M320 540 L 250 870 Q 285 965 335 975 L 480 970 Q 520 940 545 880 L 480 540 Z;
              M320 540 L 285 890 Q 295 945 325 965 L 460 975 Q 505 955 520 875 L 480 540 Z;
              M320 540 L 270 880 Q 290 950 330 970 L 470 970 Q 510 950 530 880 L 480 540 Z"/>
        </path>

        <!-- 裙摆轻纱外层（半透明）-->
        <path fill="rgba(244,154,166,0.18)"
              d="M330 600
                 L 260 920
                 Q 320 970 400 970
                 Q 480 970 540 920
                 L 470 600 Z">
          <animate attributeName="d" dur="6.8s" repeatCount="indefinite"
            values="
              M330 600 L 260 920 Q 320 970 400 970 Q 480 970 540 920 L 470 600 Z;
              M330 600 L 240 910 Q 320 980 400 970 Q 490 980 555 915 L 470 600 Z;
              M330 600 L 275 925 Q 325 965 400 970 Q 475 965 525 925 L 470 600 Z;
              M330 600 L 260 920 Q 320 970 400 970 Q 480 970 540 920 L 470 600 Z"/>
        </path>

        <!-- 腰带 -->
        <path fill="#b03a3a" opacity="0.85"
              d="M315 535 Q 400 555 485 535 L 488 565 Q 400 588 312 565 Z"/>
        <path fill="#7a2330" opacity="0.6"

        <!-- ==================== 颈与肩 ==================== -->
        <path fill="#1a0f24" d="M380 320 Q 380 360 360 380 L 440 380 Q 420 360 420 320 Z"/>

        <!-- ==================== 头部 ==================== -->

        <!-- 鬓发 -->

        <path fill="#06030c" d="M442 250 Q 455 300 440 340 Q 430 310 422 280 Z"/>

        <!-- 发髻 -->
        <ellipse cx="400" cy="232" rx="42" ry="26" fill="#06030c"/>
        <ellipse cx="400" cy="222" rx="28" ry="14" fill="#0a0612"/>
        <!-- 发簪 -->
        <rect x="397" y="200" width="6" height="34" rx="3" fill="#c9a35a"/>
        <circle cx="400" cy="198" r="6" fill="#e6c780"/>
        <circle cx="400" cy="198" r="2.5" fill="#fff5d8"/>

              d="M400 204 Q 412 224 414 250">

        <ellipse cx="383" cy="285" rx="3" ry="2" fill="#0a0612"/>
        <ellipse cx="417" cy="285" rx="3" ry="2" fill="#0a0612"/>
        <path fill="#b03a3a" opacity="0.9" d="M395 308 Q 400 312 405 308 Q 402 314 398 314 Z"/>
        <ellipse cx="380" cy="298" rx="9" ry="5" fill="url(#cheek)"/>
        <ellipse cx="420" cy="298" rx="9" ry="5" fill="url(#cheek)"/>
        <!-- 眉 -->

              d="M372 270 Q 383 266 392 271"/>
        <path fill="none" stroke="#06030c" stroke-width="1.8" stroke-linecap="round"

      </svg>
    </div>
  </div>

  <script>
    const stage = document.querySelector('.stage');
    const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches;

    // 生成飘落花瓣（按屏宽自适应数量，移动端少一些以保证流畅）
    (function spawnPetals() {
      const w = innerWidth;
      const base = w < 480 ? 14 : w < 900 ? 22 : 28;
      for (let i = 0; i < base; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        const left = Math.random() * 100;
        const size = 8 + Math.random() * 12;
        const dur  = 9 + Math.random() * 10;
        const swayDur = 2 + Math.random() * 3;
        const delay = -Math.random() * dur;
        const hue = 340 + Math.random() * 20;
        p.style.left = left + 'vw';
        p.style.width = size + 'px';
        p.style.height = (size * 0.72) + 'px';
        p.style.background =
          `radial-gradient(ellipse at 30% 30%, hsl(${hue} 80% 88%), hsl(${hue} 60% 70%) 70%, hsl(${hue} 55% 50%))`;
        p.style.opacity = (0.55 + Math.random() * 0.4).toFixed(2);
        p.style.animationDuration = `${dur}s, ${swayDur}s`;
        p.style.animationDelay = `${delay}s, ${(-Math.random()*swayDur).toFixed(2)}s`;
        stage.appendChild(p);
      }
    })();

    // 手机：轻触全屏 + 隐藏提示
    const hint = document.getElementById('hint');
    if (isTouch) hint.hidden = false;

    function goFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
      if (req) req.call(el).catch(() => {});
    }
    document.addEventListener('click', () => {
      if (hint) hint.classList.add('hidden');
      goFullscreen();
    }, { passive: true });

    // 防止 iOS Safari 双指缩放与双击缩放
    document.addEventListener('gesturestart', e => e.preventDefault());
    let lastTouch = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - lastTouch <= 350) e.preventDefault();
      lastTouch = now;
    }, { passive: false });

    // 切到后台时暂停动画，节省电量
    document.addEventListener('visibilitychange', () => {
      document.body.style.animationPlayState =
        document.hidden ? 'paused' : 'running';
    });
  </script>
</body>
</html>
