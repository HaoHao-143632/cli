<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>太空飞船</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    border: 1px solid #1a3a5c;
    box-shadow: 0 0 30px #0af, 0 0 60px #006;
  }
  #controls {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    align-items: center;
    justify-content: center;
  }
  .btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid #0af;
    background: rgba(0, 170, 255, 0.15);
    color: #0af;
    font-size: 28px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px #0af4;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active, .btn.pressed {
    background: rgba(0, 170, 255, 0.45);
    box-shadow: 0 0 20px #0af;
  }
  #shootBtn {
    width: 90px;
    height: 90px;
    border-color: #ff4;
    color: #ff4;
    font-size: 22px;
    background: rgba(255, 255, 0, 0.1);
    box-shadow: 0 0 10px #ff44;
  }
  #shootBtn:active, #shootBtn.pressed {
    background: rgba(255, 255, 0, 0.35);
    box-shadow: 0 0 20px #ff4;
  }
  #restartBtn {
    display: none;
    padding: 12px 32px;
    border: 2px solid #0f0;
    background: rgba(0,255,0,0.1);
    color: #0f0;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    box-shadow: 0 0 10px #0f04;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="controls">
  <div class="btn" id="leftBtn">◀</div>
  <div class="btn" id="shootBtn">🚀<br><small style="font-size:11px">发射</small></div>
  <div class="btn" id="rightBtn">▶</div>
</div>
<br>
<button id="restartBtn">重新开始</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  const maxW = Math.min(window.innerWidth, 480);
  const maxH = Math.min(window.innerHeight - 160, 640);
  const size = Math.min(maxW, maxH * 0.75);
  canvas.width = Math.floor(size);
  canvas.height = Math.floor(size * 1.4);
}
resize();
window.addEventListener('resize', () => { resize(); });

const W = () => canvas.width;
const H = () => canvas.height;

// ─── Game state ───────────────────────────────────────────────
let game;

function createGame() {
  return {
    player: { x: W() / 2, y: H() - 80, w: 30, h: 36 },
    bullets: [],
    enemies: [],
    particles: [],
    stars: Array.from({length: 60}, () => ({
      x: Math.random() * 500,
      y: Math.random() * 800,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 0.8 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
    })),
    score: 0,
    lives: 3,
    level: 1,
    frame: 0,
    over: false,
    shootCooldown: 0,
    invincible: 0,  // frames of invincibility after hit
  };
}

// ─── Input ────────────────────────────────────────────────────
const keys = { left: false, right: false, shoot: false };

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (e.key === ' ') { e.preventDefault(); keys.shoot = true; }
  if ((e.key === 'r' || e.key === 'R') && game.over) restartGame();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === ' ') keys.shoot = false;
});

function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on  = () => { keys[key] = true;  el.classList.add('pressed'); };
  const off = () => { keys[key] = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart', e => { e.preventDefault(); on(); }, { passive: false });
  el.addEventListener('touchend',   e => { e.preventDefault(); off(); }, { passive: false });
  el.addEventListener('touchcancel',e => { e.preventDefault(); off(); }, { passive: false });
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup',   off);
  el.addEventListener('mouseleave',off);
}
bindBtn('leftBtn',  'left');
bindBtn('rightBtn', 'right');
bindBtn('shootBtn', 'shoot');

document.getElementById('restartBtn').addEventListener('click', restartGame);
document.getElementById('restartBtn').addEventListener('touchend', e => { e.preventDefault(); restartGame(); });

function restartGame() {
  document.getElementById('restartBtn').style.display = 'none';
  game = createGame();
}

// ─── Spawn ────────────────────────────────────────────────────
const ENEMY_TYPES = [
  // kind, color, shape-label, hp, points, speed-mult
  { color: '#f44', label: '👾', hp: 1, pts: 10, sm: 1.0 },
  { color: '#a4f', label: '🛸', hp: 1, pts: 20, sm: 1.6 },
  { color: '#4f4', label: '💀', hp: 3, pts: 50, sm: 0.7 },
];

function spawnEnemy() {
  const interval = Math.max(40, 120 - game.level * 10);
  if (game.frame % interval !== 0) return;
  let kind = 0;
  const r = Math.random();
  if (game.level >= 3 && r < 0.15) kind = 2;
  else if (game.level >= 2 && r < 0.35) kind = 1;
  const t = ENEMY_TYPES[kind];
  const ew = 36;
  game.enemies.push({
    x: Math.random() * (W() - ew - 10) + 5,
    y: -40,
    w: ew, h: 36,
    kind,
    hp: t.hp,
    maxHp: t.hp,
    speed: (0.8 + game.level * 0.15) * t.sm,
    wobble: Math.random() * Math.PI * 2,
  });
}

// ─── Particles ────────────────────────────────────────────────
function explode(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    game.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: Math.random() * 0.04 + 0.025,
      r: Math.random() * 4 + 1,
      color,
    });
  }
}

// ─── Update ───────────────────────────────────────────────────
function update() {
  if (game.over) return;
  game.frame++;
  if (game.shootCooldown > 0) game.shootCooldown--;
  if (game.invincible > 0) game.invincible--;

  // Player movement
  const speed = W() * 0.006;
  if (keys.left)  game.player.x = Math.max(game.player.w / 2 + 4, game.player.x - speed);
  if (keys.right) game.player.x = Math.min(W() - game.player.w / 2 - 4, game.player.x + speed);

  // Shoot
  if (keys.shoot && game.shootCooldown === 0) {
    game.bullets.push({ x: game.player.x, y: game.player.y - 20, speed: H() * 0.018 });
    game.shootCooldown = 12;
  }

  // Move bullets
  game.bullets = game.bullets.filter(b => {
    b.y -= b.speed;
    return b.y > -10;
  });

  // Spawn & move enemies
  spawnEnemy();
  game.enemies.forEach(e => {
    e.wobble += 0.04;
    e.x += Math.sin(e.wobble) * 0.6;
    e.y += e.speed;
  });

  // Enemy reaches bottom → lose life
  game.enemies = game.enemies.filter(e => {
    if (e.y > H() + 20) {
      explode(e.x, H(), ENEMY_TYPES[e.kind].color, 10);
      game.lives--;
      if (game.lives <= 0) endGame();
      return false;
    }
    return true;
  });

  // Bullet-enemy collision
  game.bullets = game.bullets.filter(b => {
    let hit = false;
    game.enemies = game.enemies.filter(e => {
      if (!hit &&
          Math.abs(b.x - (e.x + e.w / 2)) < e.w / 2 + 4 &&
          Math.abs(b.y - (e.y + e.h / 2)) < e.h / 2 + 4) {
        e.hp--;
        hit = true;
        explode(b.x, b.y, '#ff4', 5);
        if (e.hp <= 0) {
          explode(e.x + e.w/2, e.y + e.h/2, ENEMY_TYPES[e.kind].color, 20);
          game.score += ENEMY_TYPES[e.kind].pts * game.level;
          game.level = Math.floor(game.score / 300) + 1;
          return false;
        }
      }
      return true;
    });
    return !hit;
  });

  // Player-enemy collision
  if (game.invincible === 0) {
    const px = game.player.x, py = game.player.y;
    const pw = game.player.w, ph = game.player.h;
    game.enemies = game.enemies.filter(e => {
      if (Math.abs(px - (e.x + e.w/2)) < (pw + e.w) / 2 - 6 &&
          Math.abs(py - (e.y + e.h/2)) < (ph + e.h) / 2 - 6) {
        explode(px, py, '#0af', 25);
        explode(e.x + e.w/2, e.y + e.h/2, ENEMY_TYPES[e.kind].color, 15);
        game.lives--;
        game.invincible = 90;
        if (game.lives <= 0) endGame();
        return false;
      }
      return true;
    });
  }

  // Update particles
  game.particles = game.particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    return p.life > 0;
  });

  // Scroll stars
  game.stars.forEach(s => {
    s.y += s.speed;
    s.twinkle += 0.05;
    if (s.y > H()) s.y = 0;
  });
}

function endGame() {
  game.over = true;
  document.getElementById('restartBtn').style.display = 'inline-block';
}

// ─── Draw ─────────────────────────────────────────────────────
function drawPlayer() {
  const { x, y, w, h } = game.player;
  if (game.invincible > 0 && Math.floor(game.invincible / 5) % 2 === 0) return;

  ctx.save();
  ctx.translate(x, y);

  // Engine glow
  const grd = ctx.createRadialGradient(0, h/2, 0, 0, h/2, 20);
  grd.addColorStop(0, 'rgba(0,200,255,0.6)');
  grd.addColorStop(1, 'rgba(0,0,255,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(-20, 0, 40, 40);

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(w/2, h/2);
  ctx.lineTo(w/3, h/3);
  ctx.lineTo(-w/3, h/3);
  ctx.lineTo(-w/2, h/2);
  ctx.closePath();
  ctx.fillStyle = '#0af';
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 12;
  ctx.fill();

  // Wing left
  ctx.beginPath();
  ctx.moveTo(-w/3, h/4);
  ctx.lineTo(-w, h/2);
  ctx.lineTo(-w/2, h/2);
  ctx.closePath();
  ctx.fillStyle = '#07c';
  ctx.fill();

  // Wing right
  ctx.beginPath();
  ctx.moveTo(w/3, h/4);
  ctx.lineTo(w, h/2);
  ctx.lineTo(w/2, h/2);
  ctx.closePath();
  ctx.fillStyle = '#07c';
  ctx.fill();

  // Cockpit
  ctx.beginPath();
  ctx.arc(0, -h/6, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#aef';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 8;
  ctx.fill();

  // Flame
  const flameH = 10 + Math.random() * 8;
  ctx.beginPath();
  ctx.moveTo(-8, h/2);
  ctx.quadraticCurveTo(0, h/2 + flameH + 5, 8, h/2);
  ctx.fillStyle = `rgba(${200+Math.random()*55|0},${100+Math.random()*80|0},0,0.9)`;
  ctx.shadowColor = '#f80';
  ctx.shadowBlur = 15;
  ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  const t = ENEMY_TYPES[e.kind];
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;

  ctx.save();
  ctx.font = `${e.w}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = t.color;
  ctx.shadowBlur = 10;
  ctx.fillText(t.label, cx, cy);

  // HP bar for tough enemies
  if (e.maxHp > 1) {
    const bw = e.w, bh = 4;
    const bx = e.x, by = e.y - 8;
    ctx.fillStyle = '#300';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#f44';
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W(), H());

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H());
  bg.addColorStop(0, '#000010');
  bg.addColorStop(1, '#000820');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W(), H());

  // Stars
  game.stars.forEach(s => {
    const alpha = 0.4 + 0.6 * (Math.sin(s.twinkle) * 0.5 + 0.5);
    ctx.beginPath();
    ctx.arc(s.x % W(), s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.fill();
  });

  // Particles
  game.particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Bullets
  game.bullets.forEach(b => {
    ctx.save();
    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + 14);
    grad.addColorStop(0, '#ff0');
    grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + 14);
    ctx.stroke();
    ctx.restore();
  });

  // Enemies
  game.enemies.forEach(drawEnemy);

  // Player
  if (!game.over) drawPlayer();

  // HUD
  const fs = Math.max(13, W() * 0.035);
  ctx.font = `bold ${fs}px 'Courier New'`;
  ctx.shadowBlur = 0;

  // Score
  ctx.fillStyle = '#0af';
  ctx.textAlign = 'left';
  ctx.fillText(`分数: ${game.score}`, 10, fs + 6);

  // Level
  ctx.fillStyle = '#ff4';
  ctx.textAlign = 'center';
  ctx.fillText(`关卡 ${game.level}`, W() / 2, fs + 6);

  // Lives
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f55';
  ctx.fillText('❤️'.repeat(game.lives), W() - 8, fs + 6);

  // Game over overlay
  if (game.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W(), H());

    const big = Math.max(28, W() * 0.09);
    ctx.font = `bold ${big}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', W() / 2, H() / 2 - big);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4';
    ctx.font = `bold ${big * 0.6}px 'Courier New'`;
    ctx.fillText(`最终分数: ${game.score}`, W() / 2, H() / 2 + big * 0.2);
  }
}

// ─── Loop ─────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

game = createGame();
loop();
</script>
</body>
</html>
