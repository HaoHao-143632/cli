<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>游戏目录</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #1a1a3a 0%, #050510 70%);
    color: #fff;
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(10, 10, 30, 0.55);
    border: 1px solid rgba(255, 80, 40, 0.4);
    padding: 40px 56px;
    border-radius: 8px;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  h1 {
    background: linear-gradient(90deg, #ff3c1e, #ffaa00, #ff3c1e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 4px;
    margin: 0 0 24px;
  }
  a {
    display: inline-block;
    background: linear-gradient(135deg, #ff3c1e, #ff7a00);
    color: #fff;
    text-decoration: none;
    padding: 12px 36px;
    font-weight: 700;
    letter-spacing: 3px;
    border-radius: 4px;
    box-shadow: 0 0 24px rgba(255, 60, 30, 0.5);
  }
  a:hover { box-shadow: 0 0 36px rgba(255, 60, 30, 0.8); }
</style>
</head>
<body>
<div class="card">
  <h1>GAMES</h1>
  <a href="./racing/">极品飞车 →</a>
</div>
</body>
</html>
