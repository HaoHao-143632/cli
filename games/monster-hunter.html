<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>勇者斗怪兽</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    color: #fff;
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  h1 {
    margin-bottom: 12px;
    font-size: 28px;
    color: #ffd54a;
    text-shadow: 0 0 10px rgba(255, 213, 74, 0.6);
  }
  #gameWrap {
    position: relative;
    box-shadow: 0 0 40px rgba(255, 100, 100, 0.25);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, #1a1d2e 0%, #2d1b3d 100%);
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .stat { background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; }
  .hp-bar {
    display: inline-block;
    width: 120px;
    height: 10px;
    background: #3a1010;
    border: 1px solid #ff5a5a;
    vertical-align: middle;
    margin-left: 6px;
    border-radius: 2px;
    overflow: hidden;
  }
  .hp-fill { height: 100%; background: linear-gradient(90deg, #ff3a3a, #ff8a3a); transition: width 0.2s; }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 36px; color: #ffd54a; margin-bottom: 10px; }
  #overlay p { font-size: 14px; line-height: 1.8; color: #ccc; margin-bottom: 16px; }
  #overlay button {
    background: #ffd54a;
    color: #1a1a2a;
    border: none;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  #overlay button:hover { transform: scale(1.05); }
  .keys { color: #ffd54a; font-weight: bold; }
  #footer { margin-top: 12px; font-size: 12px; color: #666; }
</style>
</head>
<body>
<h1>⚔️ 勇者斗怪兽 ⚔️</h1>
<div id="gameWrap">
  <canvas id="game" width="800" height="560"></canvas>
  <div id="hud">
    <div>
      <span class="stat">生命 <span class="hp-bar"><span id="hpFill" class="hp-fill" style="width:100%"></span></span></span>
      <span class="stat">等级 <span id="level">1</span></span>
    </div>
    <div>
      <span class="stat">击杀 <span id="kills">0</span></span>
      <span class="stat">分数 <span id="score">0</span></span>
      <span class="stat">第 <span id="wave">1</span> 波</span>
    </div>
  </div>
  <div id="overlay">
    <h2 id="overlayTitle">勇者斗怪兽</h2>
    <p id="overlayText">
      使用 <span class="keys">WASD</span> 或 <span class="keys">方向键</span> 移动<br>
      <span class="keys">空格</span> 或 <span class="keys">鼠标左键</span> 攻击<br>
      <span class="keys">Shift</span> 冲刺(短暂无敌)<br><br>
      消灭尽可能多的怪物,生存下来!
    </p>
    <button id="startBtn">开始游戏</button>
  </div>
</div>
<div id="footer">提示:升级会恢复部分生命,Boss 每 5 波出现一次</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const hpFill = document.getElementById('hpFill');
  const levelEl = document.getElementById('level');
  const killsEl = document.getElementById('kills');
  const scoreEl = document.getElementById('score');
  const waveEl = document.getElementById('wave');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const keys = {};
  let mouseX = W/2, mouseY = H/2, mouseDown = false;

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * (W / r.width);
    mouseY = (e.clientY - r.top) * (H / r.height);
  });
  canvas.addEventListener('mousedown', () => mouseDown = true);
  canvas.addEventListener('mouseup', () => mouseDown = false);

  const game = {
    player: null,
    monsters: [],
    bullets: [],
    particles: [],
    floatTexts: [],
    kills: 0,
    score: 0,
    wave: 1,
    level: 1,
    xp: 0,
    xpNext: 5,
    waveTimer: 0,
    spawnCooldown: 0,
    running: false,
    bossActive: false,
  };

  function createPlayer() {
    return {
      x: W/2, y: H/2, r: 14,
      hp: 100, maxHp: 100,
      speed: 3.2,
      attackCooldown: 0,
      attackRate: 18,
      damage: 14,
      bulletSpeed: 7,
      dashCooldown: 0,
      invuln: 0,
      facing: 0,
    };
  }

  function spawnMonster(type) {
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * W; y = -20; }
    else if (edge === 1) { x = W + 20; y = Math.random() * H; }
    else if (edge === 2) { x = Math.random() * W; y = H + 20; }
    else { x = -20; y = Math.random() * H; }

    const tier = game.wave;
    if (type === 'boss') {
      return {
        x, y, r: 40,
        hp: 400 + tier * 60, maxHp: 400 + tier * 60,
        speed: 1.0 + tier * 0.05,
        damage: 25,
        color: '#c62828',
        type: 'boss',
        xp: 30,
        score: 200,
        attackCooldown: 0,
      };
    }
    if (type === 'fast') {
      return {
        x, y, r: 10,
        hp: 20 + tier * 5, maxHp: 20 + tier * 5,
        speed: 2.6 + tier * 0.08,
        damage: 8,
        color: '#7e57c2',
        type: 'fast',
        xp: 2,
        score: 15,
      };
    }
    if (type === 'tank') {
      return {
        x, y, r: 22,
        hp: 90 + tier * 15, maxHp: 90 + tier * 15,
        speed: 0.9,
        damage: 18,
        color: '#558b2f',
        type: 'tank',
        xp: 6,
        score: 40,
      };
    }
    return {
      x, y, r: 15,
      hp: 35 + tier * 8, maxHp: 35 + tier * 8,
      speed: 1.5 + tier * 0.06,
      damage: 12,
      color: '#ef6c00',
      type: 'grunt',
      xp: 3,
      score: 20,
    };
  }

  function startWave() {
    game.bossActive = false;
    waveEl.textContent = game.wave;
    if (game.wave % 5 === 0) {
      game.monsters.push(spawnMonster('boss'));
      game.bossActive = true;
      pushFloat(W/2, 80, '⚠ BOSS 出现!⚠', '#ff5252', 90, 20);
    }
    const base = 4 + Math.floor(game.wave * 1.5);
    game.spawnQueue = base;
  }

  function pushFloat(x, y, text, color, life=40, size=14) {
    game.floatTexts.push({ x, y, text, color, life, max: life, size });
  }

  function spawnParticles(x, y, color, count=10) {
    for (let i = 0; i < count; i++) {
      game.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6,
        life: 20 + Math.random() * 15,
        max: 30,
        color,
        r: 1 + Math.random() * 2,
      });
    }
  }

  function shoot() {
    const p = game.player;
    if (p.attackCooldown > 0) return;
    const tx = mouseDown ? mouseX : (function(){
      // aim at nearest monster
      let best = null, bd = Infinity;
      for (const m of game.monsters) {
        const d = (m.x - p.x)**2 + (m.y - p.y)**2;
        if (d < bd) { bd = d; best = m; }
      }
      return best ? best.x : p.x + Math.cos(p.facing) * 100;
    })();
    const ty = mouseDown ? mouseY : (function(){
      let best = null, bd = Infinity;
      for (const m of game.monsters) {
        const d = (m.x - p.x)**2 + (m.y - p.y)**2;
        if (d < bd) { bd = d; best = m; }
      }
      return best ? best.y : p.y + Math.sin(p.facing) * 100;
    })();
    const dx = tx - p.x, dy = ty - p.y;
    const len = Math.hypot(dx, dy) || 1;
    game.bullets.push({
      x: p.x, y: p.y,
      vx: (dx/len) * p.bulletSpeed,
      vy: (dy/len) * p.bulletSpeed,
      r: 4,
      damage: p.damage,
      life: 60,
    });
    p.attackCooldown = p.attackRate;
  }

  function update() {
    const p = game.player;

    // Player movement
    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 0) {
      mx /= ml; my /= ml;
      p.facing = Math.atan2(my, mx);
    }

    let speed = p.speed;
    if (p.dashCooldown > 0) p.dashCooldown--;
    if (keys['shift'] && p.dashCooldown === 0 && ml > 0) {
      speed *= 3;
      p.invuln = 10;
      p.dashCooldown = 50;
      spawnParticles(p.x, p.y, '#80deea', 8);
    }

    p.x = Math.max(p.r, Math.min(W - p.r, p.x + mx * speed));
    p.y = Math.max(p.r, Math.min(H - p.r, p.y + my * speed));

    if (p.invuln > 0) p.invuln--;
    if (p.attackCooldown > 0) p.attackCooldown--;

    // Auto-shoot or manual
    if (keys[' '] || mouseDown) shoot();

    // Spawn monsters from queue
    if (game.spawnCooldown > 0) game.spawnCooldown--;
    if (game.spawnQueue > 0 && game.spawnCooldown <= 0) {
      const roll = Math.random();
      let t = 'grunt';
      if (game.wave >= 2 && roll < 0.25) t = 'fast';
      else if (game.wave >= 3 && roll < 0.4) t = 'tank';
      game.monsters.push(spawnMonster(t));
      game.spawnQueue--;
      game.spawnCooldown = 40;
    }

    // Monsters
    for (let i = game.monsters.length - 1; i >= 0; i--) {
      const m = game.monsters[i];
      const dx = p.x - m.x, dy = p.y - m.y;
      const d = Math.hypot(dx, dy) || 1;
      m.x += (dx/d) * m.speed;
      m.y += (dy/d) * m.speed;

      if (d < m.r + p.r && p.invuln === 0) {
        p.hp -= m.damage;
        p.invuln = 30;
        spawnParticles(p.x, p.y, '#ff3a3a', 12);
        pushFloat(p.x, p.y - 20, '-' + m.damage, '#ff5252');
        // knockback
        p.x -= (dx/d) * 15;
        p.y -= (dy/d) * 15;
        if (p.hp <= 0) {
          gameOver();
          return;
        }
      }
    }

    // Bullets
    for (let i = game.bullets.length - 1; i >= 0; i--) {
      const b = game.bullets[i];
      b.x += b.vx; b.y += b.vy;
      b.life--;
      if (b.life <= 0 || b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
        game.bullets.splice(i, 1);
        continue;
      }
      // hit monster
      for (let j = game.monsters.length - 1; j >= 0; j--) {
        const m = game.monsters[j];
        const dx = b.x - m.x, dy = b.y - m.y;
        if (dx*dx + dy*dy < (b.r + m.r)**2) {
          m.hp -= b.damage;
          spawnParticles(b.x, b.y, m.color, 4);
          pushFloat(m.x, m.y - m.r - 4, '-' + b.damage, '#ffeb3b', 25, 12);
          game.bullets.splice(i, 1);
          if (m.hp <= 0) {
            spawnParticles(m.x, m.y, m.color, 18);
            game.kills++;
            game.score += m.score;
            game.xp += m.xp;
            if (m.type === 'boss') game.bossActive = false;
            game.monsters.splice(j, 1);
            checkLevelUp();
          }
          break;
        }
      }
    }

    // Particles
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const pr = game.particles[i];
      pr.x += pr.vx; pr.y += pr.vy;
      pr.vx *= 0.92; pr.vy *= 0.92;
      pr.life--;
      if (pr.life <= 0) game.particles.splice(i, 1);
    }

    // Float texts
    for (let i = game.floatTexts.length - 1; i >= 0; i--) {
      const f = game.floatTexts[i];
      f.y -= 0.6;
      f.life--;
      if (f.life <= 0) game.floatTexts.splice(i, 1);
    }

    // Wave progression
    if (game.spawnQueue === 0 && game.monsters.length === 0) {
      game.waveTimer++;
      if (game.waveTimer > 90) {
        game.wave++;
        game.waveTimer = 0;
        pushFloat(W/2, H/2, '第 ' + game.wave + ' 波!', '#ffd54a', 80, 28);
        startWave();
      }
    }

    // HUD
    hpFill.style.width = Math.max(0, (p.hp / p.maxHp) * 100) + '%';
    killsEl.textContent = game.kills;
    scoreEl.textContent = game.score;
    levelEl.textContent = game.level;
  }

  function checkLevelUp() {
    while (game.xp >= game.xpNext) {
      game.xp -= game.xpNext;
      game.level++;
      game.xpNext = Math.floor(game.xpNext * 1.5);
      const p = game.player;
      p.maxHp += 15;
      p.hp = Math.min(p.maxHp, p.hp + 30);
      p.damage += 3;
      if (game.level % 3 === 0) p.attackRate = Math.max(6, p.attackRate - 2);
      pushFloat(p.x, p.y - 30, '升级! Lv.' + game.level, '#ffd54a', 60, 18);
      spawnParticles(p.x, p.y, '#ffd54a', 25);
    }
  }

  function draw() {
    // Background grid
    ctx.fillStyle = '#1a1d2e';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    const p = game.player;

    // Particles
    for (const pr of game.particles) {
      ctx.globalAlpha = pr.life / pr.max;
      ctx.fillStyle = pr.color;
      ctx.beginPath();
      ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Monsters
    for (const m of game.monsters) {
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
      // eyes
      ctx.fillStyle = '#fff';
      const ex = (p.x - m.x), ey = (p.y - m.y);
      const el = Math.hypot(ex, ey) || 1;
      const eox = (ex/el) * m.r * 0.3, eoy = (ey/el) * m.r * 0.3;
      ctx.beginPath();
      ctx.arc(m.x - m.r*0.3 + eox, m.y - m.r*0.2 + eoy, m.r*0.18, 0, Math.PI*2);
      ctx.arc(m.x + m.r*0.3 + eox, m.y - m.r*0.2 + eoy, m.r*0.18, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(m.x - m.r*0.3 + eox*1.5, m.y - m.r*0.2 + eoy*1.5, m.r*0.08, 0, Math.PI*2);
      ctx.arc(m.x + m.r*0.3 + eox*1.5, m.y - m.r*0.2 + eoy*1.5, m.r*0.08, 0, Math.PI*2);
      ctx.fill();
      // HP bar
      if (m.hp < m.maxHp) {
        const bw = m.r * 2;
        ctx.fillStyle = '#400';
        ctx.fillRect(m.x - m.r, m.y - m.r - 8, bw, 4);
        ctx.fillStyle = '#f44';
        ctx.fillRect(m.x - m.r, m.y - m.r - 8, bw * (m.hp / m.maxHp), 4);
      }
    }

    // Bullets
    for (const b of game.bullets) {
      ctx.fillStyle = '#ffd54a';
      ctx.shadowColor = '#ffd54a';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Player
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.invuln > 0 && Math.floor(p.invuln/3) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.rotate(p.facing);
    // body
    ctx.fillStyle = '#42a5f5';
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, Math.PI * 2);
    ctx.fill();
    // sword/direction
    ctx.fillStyle = '#e0e0e0';
    ctx.fillRect(p.r * 0.4, -3, p.r * 1.2, 6);
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(p.r * 0.4 - 4, -5, 4, 10);
    ctx.restore();
    ctx.globalAlpha = 1;

    // XP bar
    const xpW = 160;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W/2 - xpW/2, H - 18, xpW, 8);
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(W/2 - xpW/2, H - 18, xpW * (game.xp / game.xpNext), 8);
    ctx.fillStyle = '#fff';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('XP ' + game.xp + ' / ' + game.xpNext, W/2, H - 22);

    // Dash cooldown indicator
    if (p.dashCooldown > 0) {
      ctx.fillStyle = 'rgba(128,222,234,0.8)';
      ctx.fillRect(p.x - 14, p.y + p.r + 6, 28 * (1 - p.dashCooldown/50), 3);
    }

    // Float texts
    for (const f of game.floatTexts) {
      ctx.globalAlpha = Math.min(1, f.life / 20);
      ctx.fillStyle = f.color;
      ctx.font = 'bold ' + f.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function gameOver() {
    game.running = false;
    overlayTitle.textContent = '游戏结束';
    overlayText.innerHTML =
      '你坚持到了 <span class="keys">第 ' + game.wave + ' 波</span><br>' +
      '击杀:<span class="keys">' + game.kills + '</span> | 分数:<span class="keys">' + game.score + '</span> | 等级:<span class="keys">' + game.level + '</span><br><br>' +
      '再来一局?';
    startBtn.textContent = '再战';
    overlay.classList.remove('hidden');
  }

  function loop() {
    if (game.running) update();
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    game.player = createPlayer();
    game.monsters = [];
    game.bullets = [];
    game.particles = [];
    game.floatTexts = [];
    game.kills = 0;
    game.score = 0;
    game.wave = 1;
    game.level = 1;
    game.xp = 0;
    game.xpNext = 5;
    game.waveTimer = 0;
    game.spawnCooldown = 0;
    game.running = true;
    overlay.classList.add('hidden');
    startWave();
  }

  startBtn.addEventListener('click', startGame);
  loop();
})();
</script>
</body>
</html>
