<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞机大战 · Airplane Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05080f;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, #0a1530 0%, #05080f 60%, #02030a 100%);
    box-shadow: 0 0 60px rgba(40, 120, 255, 0.25);
    border-radius: 4px;
    image-rendering: pixelated;
  }
  /* Overlays */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #e8f0ff;
    background: rgba(3, 6, 14, 0.72);
    backdrop-filter: blur(3px);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: clamp(34px, 8vw, 64px);
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #4fd1ff, #7c8bff, #ff6ad5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(90, 150, 255, 0.4);
    margin-bottom: 6px;
  }
  .subtitle { font-size: 14px; color: #8fa6cf; letter-spacing: 3px; margin-bottom: 28px; }
  .panel {
    font-size: 15px;
    line-height: 2;
    color: #b9cbe8;
    margin-bottom: 26px;
  }
  .panel b { color: #fff; }
  .key {
    display: inline-block;
    min-width: 26px;
    padding: 2px 8px;
    margin: 0 2px;
    background: #1a2747;
    border: 1px solid #34507f;
    border-radius: 6px;
    color: #cfe0ff;
    font-size: 13px;
  }
  .btn {
    padding: 14px 44px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #04101f;
    background: linear-gradient(90deg, #57e2ff, #7c9bff);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(80, 160, 255, 0.4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(80, 160, 255, 0.55); }
  .btn:active { transform: translateY(0); }
  .bigscore { font-size: 22px; margin: 4px 0 2px; color: #fff; }
  .bigscore span { color: #ffd95a; font-weight: 800; }
  .hint-mobile { display: none; font-size: 13px; color: #7e93ba; margin-top: 18px; }
  /* 静音按钮 */
  .mute {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(18, 28, 52, 0.6);
    border: 1px solid #34507f;
    color: #cfe0ff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease;
  }
  .mute:hover { background: rgba(40, 60, 100, 0.8); }
  /* 炸弹大招按钮 */
  .bomb {
    position: absolute;
    right: 18px;
    bottom: 24px;
    z-index: 20;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb86b, #b8541a);
    border: 2px solid #ffd9a8;
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255, 140, 50, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .bomb:active { transform: scale(0.92); }
  @media (hover: none) and (pointer: coarse) {
    .hint-mobile { display: block; }
    .hint-desktop { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- 静音开关（🔊/🔇，M 键也可切换） -->
  <button id="muteBtn" class="mute" title="静音 (M)">🔊</button>

  <!-- 炸弹大招按钮（手机用，B / 空格 也可触发） -->
  <button id="bombBtn" class="bomb" title="清屏炸弹 (B)">💣</button>

  <!-- Start screen -->
  <div id="startScreen" class="overlay">
    <div class="title">飞机大战</div>
    <div class="subtitle">AIRPLANE&nbsp;SHOOTER</div>
    <div class="panel hint-desktop">
      <span class="key">←</span><span class="key">→</span><span class="key">↑</span><span class="key">↓</span> 或 <span class="key">WASD</span> 移动 · 鼠标也可控制<br>
      <b>自动开火</b>　·　<span class="key">B</span>/<span class="key">空格</span> 放炸弹💣　·　<span class="key">P</span> 暂停<br>
      吃道具升级火力 · 累计分数挑战 <b style="color:#ff7a93">BOSS</b>
    </div>
    <div class="panel hint-mobile">
      <b>手指拖动</b>控制飞机 · 自动开火<br>
      点右下角 <b style="color:#ffb86b">💣</b> 放清屏炸弹 · 躲子弹打 <b style="color:#ff7a93">BOSS</b>
    </div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <!-- Game over screen -->
  <div id="overScreen" class="overlay hidden">
    <div class="title" style="font-size:clamp(28px,6vw,48px)">游戏结束</div>
    <div class="bigscore">本局得分　<span id="finalScore">0</span></div>
    <div class="bigscore" style="font-size:16px;color:#9fb4d8">历史最高　<span id="bestScore" style="color:#ffd95a">0</span></div>
    <div style="height:24px"></div>
    <button class="btn" id="retryBtn">再来一局</button>
  </div>

  <!-- Pause screen -->
  <div id="pauseScreen" class="overlay hidden">
    <div class="title" style="font-size:clamp(28px,6vw,48px)">暂停中</div>
    <div class="panel">按 <span class="key">P</span> 或点击继续</div>
    <button class="btn" id="resumeBtn">继续游戏</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
