<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b1026" />
<title>飞机大战 · 手机版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1026;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: linear-gradient(180deg, #0b1026 0%, #1a2050 55%, #2a1a60 100%);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: env(safe-area-inset-top, 12px);
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 5;
  }
  #hud .box {
    background: rgba(0,0,0,0.35);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
  }
  #score { color: #ffd86b; font-weight: 700; }
  #lives { color: #ff7d9d; font-weight: 700; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: rgba(6, 10, 30, 0.78);
    backdrop-filter: blur(8px);
    z-index: 10;
    padding: 24px;
  }
  .overlay h1 {
    font-size: 32px;
    margin-bottom: 8px;
    background: linear-gradient(90deg,#ffd86b,#ff7d9d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .overlay p {
    font-size: 14px;
    opacity: 0.85;
    line-height: 1.7;
    margin: 6px 0 18px;
    max-width: 300px;
  }
  .btn {
    padding: 12px 36px;
    font-size: 16px;
    color: #0b1026;
    background: linear-gradient(90deg, #ffd86b, #ff9d7d);
    border: none;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 157, 125, 0.35);
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.96); }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    opacity: 0.55;
  }
  .hidden { display: none !important; }
  #pauseBtn {
    position: absolute;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 12px) + 14px);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 18px;
    z-index: 6;
    backdrop-filter: blur(6px);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="box">得分 <span id="score">0</span></div>
    <div class="box">生命 <span id="lives">♥♥♥</span></div>
  </div>
  <button id="pauseBtn" aria-label="暂停">⏸</button>

  <div id="startScreen" class="overlay">
    <h1>飞机大战</h1>
    <p>手指在屏幕上滑动控制飞机<br>自动开火 · 躲避敌机 · 收集道具</p>
    <button class="btn" id="startBtn">开 始</button>
    <div class="hint">建议横握或竖握手机，保持专注 ✈</div>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>游戏结束</h1>
    <p>本局得分 <span id="finalScore" style="color:#ffd86b;font-weight:700;">0</span><br>最高纪录 <span id="bestScore" style="color:#ff9d7d;font-weight:700;">0</span></p>
    <button class="btn" id="restartBtn">再 来 一 局</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const pauseBtn = document.getElementById('pauseBtn');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  const state = {
    running: false,
    paused: false,
    score: 0,
    lives: 3,
    time: 0,
    lastShot: 0,
    shotCooldown: 220,
    spawnTimer: 0,
    spawnInterval: 900,
    powerTimer: 0,
    powerLevel: 1,
    invincibleUntil: 0,
  };

  const player = {
    x: 0, y: 0, r: 18,
    dragging: false,
    trail: [],
  };

  const bullets = [];
  const enemies = [];
  const particles = [];
  const powerups = [];
  const stars = [];

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.3,
        v: Math.random() * 0.8 + 0.2,
        a: Math.random() * 0.6 + 0.3,
      });
    }
  }
  initStars();

  function reset() {
    state.score = 0;
    state.lives = 3;
    state.time = 0;
    state.lastShot = 0;
    state.spawnTimer = 0;
    state.spawnInterval = 900;
    state.powerLevel = 1;
    state.powerTimer = 0;
    state.invincibleUntil = 0;
    player.x = W / 2;
    player.y = H - 120;
    player.trail.length = 0;
    bullets.length = 0;
    enemies.length = 0;
    particles.length = 0;
    powerups.length = 0;
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = state.score;
    livesEl.textContent = '♥'.repeat(Math.max(0, state.lives));
  }

  function startGame() {
    reset();
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    state.running = true;
    state.paused = false;
    lastFrame = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    const best = Math.max(state.score, parseInt(localStorage.getItem('airplane_best') || '0', 10));
    localStorage.setItem('airplane_best', best);
    finalScoreEl.textContent = state.score;
    bestScoreEl.textContent = best;
    gameOverScreen.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', () => {
    if (!state.running) return;
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? '▶' : '⏸';
    if (!state.paused) {
      lastFrame = performance.now();
      requestAnimationFrame(loop);
    }
  });

  function pointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  function onPointerDown(e) {
    if (!state.running) return;
    e.preventDefault();
    player.dragging = true;
    const p = pointerPos(e);
    player.x = p.x;
    player.y = Math.min(p.y, H - 40);
  }
  function onPointerMove(e) {
    if (!state.running || !player.dragging) return;
    e.preventDefault();
    const p = pointerPos(e);
    player.x = Math.max(20, Math.min(W - 20, p.x));
    player.y = Math.max(40, Math.min(H - 30, p.y));
  }
  function onPointerUp() { player.dragging = false; }

  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  canvas.addEventListener('touchend', onPointerUp);
  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('mouseleave', onPointerUp);

  function spawnEnemy() {
    const tierRoll = Math.random();
    const difficulty = 1 + state.time / 30000;
    let type = 'small';
    if (tierRoll < 0.12 * Math.min(difficulty, 2.5)) type = 'big';
    else if (tierRoll < 0.45) type = 'med';

    const cfg = {
      small: { r: 14, hp: 1, v: 2.2 + Math.random() * 1.2, color: '#7ce9ff', score: 10 },
      med:   { r: 20, hp: 3, v: 1.6 + Math.random() * 0.8, color: '#ff9d7d', score: 30 },
      big:   { r: 30, hp: 8, v: 1.0 + Math.random() * 0.5, color: '#ff5b7a', score: 80 },
    }[type];
    enemies.push({
      type, x: 30 + Math.random() * (W - 60), y: -cfg.r,
      vx: (Math.random() - 0.5) * 1.2,
      vy: cfg.v * difficulty,
      r: cfg.r, hp: cfg.hp, maxHp: cfg.hp, color: cfg.color, score: cfg.score,
    });
  }

  function spawnPowerup(x, y) {
    const types = ['power', 'life'];
    const type = Math.random() < 0.15 ? 'life' : 'power';
    powerups.push({
      x, y, vy: 1.4, r: 12, type,
    });
  }

  function shoot() {
    const now = state.time;
    if (now - state.lastShot < state.shotCooldown) return;
    state.lastShot = now;
    const lvl = state.powerLevel;
    if (lvl === 1) {
      bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -9, r: 3 });
    } else if (lvl === 2) {
      bullets.push({ x: player.x - 8, y: player.y - 16, vx: 0, vy: -9, r: 3 });
      bullets.push({ x: player.x + 8, y: player.y - 16, vx: 0, vy: -9, r: 3 });
    } else {
      bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: -10, r: 3.5 });
      bullets.push({ x: player.x - 10, y: player.y - 14, vx: -1.2, vy: -8.5, r: 3 });
      bullets.push({ x: player.x + 10, y: player.y - 14, vx: 1.2, vy: -8.5, r: 3 });
    }
  }

  function burst(x, y, color, count = 12, speed = 3) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * speed + 1;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 500 + Math.random() * 300,
        age: 0,
        color,
        r: Math.random() * 2.5 + 1,
      });
    }
  }

  let lastFrame = performance.now();
  function loop(now) {
    if (!state.running || state.paused) return;
    const dt = Math.min(48, now - lastFrame);
    lastFrame = now;
    state.time += dt;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    for (const s of stars) {
      s.y += s.v * (dt / 16);
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    shoot();

    state.spawnTimer += dt;
    const spawnInt = Math.max(280, state.spawnInterval - state.time * 0.02);
    if (state.spawnTimer >= spawnInt) {
      state.spawnTimer = 0;
      spawnEnemy();
      if (Math.random() < 0.25) spawnEnemy();
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.y < -10 || b.x < -10 || b.x > W + 10) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.x += e.vx;
      e.y += e.vy;
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
      if (e.y > H + 40) { enemies.splice(i, 1); continue; }

      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const dx = b.x - e.x, dy = b.y - e.y;
        if (dx * dx + dy * dy < (e.r + b.r) * (e.r + b.r)) {
          e.hp -= 1;
          bullets.splice(j, 1);
          burst(b.x, b.y, '#fff4b0', 4, 2);
          if (e.hp <= 0) {
            burst(e.x, e.y, e.color, 18, 4);
            state.score += e.score;
            if (Math.random() < (e.type === 'big' ? 0.6 : e.type === 'med' ? 0.2 : 0.05)) {
              spawnPowerup(e.x, e.y);
            }
            enemies.splice(i, 1);
            updateHUD();
            break;
          }
        }
      }

      if (i >= enemies.length) continue;
      const dx = player.x - e.x, dy = player.y - e.y;
      if (dx * dx + dy * dy < (player.r + e.r) * (player.r + e.r)) {
        if (state.time > state.invincibleUntil) {
          state.lives -= 1;
          state.invincibleUntil = state.time + 1600;
          burst(player.x, player.y, '#ff7d9d', 22, 4.5);
          burst(e.x, e.y, e.color, 14, 3.5);
          enemies.splice(i, 1);
          state.powerLevel = Math.max(1, state.powerLevel - 1);
          updateHUD();
          if (state.lives <= 0) { endGame(); return; }
        }
      }
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy;
      if (p.y > H + 20) { powerups.splice(i, 1); continue; }
      const dx = player.x - p.x, dy = player.y - p.y;
      if (dx * dx + dy * dy < (player.r + p.r) * (player.r + p.r)) {
        if (p.type === 'power') {
          state.powerLevel = Math.min(3, state.powerLevel + 1);
        } else {
          state.lives = Math.min(5, state.lives + 1);
        }
        burst(p.x, p.y, p.type === 'life' ? '#ff7d9d' : '#ffd86b', 16, 3);
        powerups.splice(i, 1);
        updateHUD();
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.age += dt;
      if (p.age >= p.life) particles.splice(i, 1);
    }

    player.trail.unshift({ x: player.x, y: player.y + 14 });
    if (player.trail.length > 10) player.trail.pop();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#cfe0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      const a = (1 - i / player.trail.length) * 0.4;
      ctx.fillStyle = `rgba(255, 216, 107, ${a})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y + i * 2, 6 - i * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const invincible = state.time < state.invincibleUntil;
    const blink = invincible && Math.floor(state.time / 80) % 2 === 0;
    if (!blink) drawPlayer(player.x, player.y);

    ctx.save();
    ctx.fillStyle = '#fff4b0';
    ctx.shadowColor = '#ffd86b';
    ctx.shadowBlur = 8;
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    for (const e of enemies) drawEnemy(e);
    for (const p of powerups) drawPowerup(p);

    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#ffd86b';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(14, 10);
    ctx.lineTo(6, 6);
    ctx.lineTo(6, 18);
    ctx.lineTo(-6, 18);
    ctx.lineTo(-6, 6);
    ctx.lineTo(-14, 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#8ee7ff';
    ctx.beginPath();
    ctx.ellipse(0, -4, 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff9d7d';
    ctx.beginPath();
    ctx.moveTo(-3, 16);
    ctx.lineTo(0, 24);
    ctx.lineTo(3, 16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.color;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.2;
    const r = e.r;
    ctx.beginPath();
    ctx.moveTo(0, r);
    ctx.lineTo(r, -r * 0.4);
    ctx.lineTo(r * 0.4, -r * 0.2);
    ctx.lineTo(r * 0.4, -r);
    ctx.lineTo(-r * 0.4, -r);
    ctx.lineTo(-r * 0.4, -r * 0.2);
    ctx.lineTo(-r, -r * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(0, -r * 0.3, r * 0.2, 0, Math.PI * 2);
    ctx.fill();

    if (e.hp < e.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-r, -r - 8, r * 2, 4);
      ctx.fillStyle = '#8eff7d';
      ctx.fillRect(-r, -r - 8, r * 2 * (e.hp / e.maxHp), 4);
    }
    ctx.restore();
  }

  function drawPowerup(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const pulse = 1 + Math.sin(state.time / 150) * 0.15;
    ctx.scale(pulse, pulse);
    if (p.type === 'power') {
      ctx.fillStyle = '#ffd86b';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(a) * p.r;
        const y = Math.sin(a) * p.r;
        ctx.lineTo(x, y);
        const a2 = a + Math.PI / 5;
        ctx.lineTo(Math.cos(a2) * p.r * 0.5, Math.sin(a2) * p.r * 0.5);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ff7d9d';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(0, p.r * 0.4);
      ctx.bezierCurveTo(p.r, -p.r * 0.6, p.r * 0.4, -p.r * 1.1, 0, -p.r * 0.3);
      ctx.bezierCurveTo(-p.r * 0.4, -p.r * 1.1, -p.r, -p.r * 0.6, 0, p.r * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.running && !state.paused) {
      state.paused = true;
      pauseBtn.textContent = '▶';
    }
  });

  window.addEventListener('load', () => {
    player.x = W / 2;
    player.y = H - 120;
    render();
  });
})();
</script>
</body>
</html>
